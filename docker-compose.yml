version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: zoning-db
    environment:
      POSTGRES_USER: zoning_user
      POSTGRES_PASSWORD: zoning_pass
      POSTGRES_DB: zoning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoning_user -d zoning_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
